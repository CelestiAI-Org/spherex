# Keeps the Render free-plan frontend awake (it sleeps after ~15 min without traffic) and fails loudly if it
# is down. Only the frontend is pinged: the API is allowed to sleep, to stay inside Render's 750 free
# instance-hours a month. While it sleeps, the frontend's proxy serves the cached targets from its offline
# copy and wakes the API in the background. Scheduled workflows only run from the default branch (main).
name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the frontend
        run: |
          # A sleeping service can take ~30-60 s to wake: 60 s per attempt, 3 retries, 10 s apart.
          url=https://spherex-web.onrender.com/health
          code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 60 \
                      --retry 3 --retry-delay 10 --retry-all-errors "$url") || true
          echo "$code  $url  $(head -c 200 /tmp/body 2>/dev/null)"
          [ "$code" = 200 ] || { echo "::error title=Keep-alive failed::$url answered HTTP ${code:-none} after retries"; exit 1; }
